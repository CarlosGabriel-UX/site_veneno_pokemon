<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Área do assinante | Injection</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0b0c" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav__inner">
      <a href="index.html" class="brand" aria-label="Injection, início">
        <img src="assets/logo.svg" alt="" width="36" height="36" />
        <span>injection<strong>_</strong></span>
      </a>
      <a href="index.html" class="btn btn--ghost btn--sm">← Voltar ao site</a>
    </div>
  </header>

  <main class="auth">
    <div class="hero__glow" aria-hidden="true"></div>
    <div class="auth__card">
      <p class="auth__prompt">Acesso restrito</p>
      <h1>Área do assinante</h1>
      <p>Entre para baixar seus scripts, ver suas chaves de ativação e gerenciar sua assinatura.</p>
      <form id="login-form" novalidate>
        <label class="field">
          <span>E-mail</span>
          <input type="email" name="email" autocomplete="email" placeholder="voce@email.com" required />
        </label>
        <label class="field">
          <span>Senha</span>
          <input type="password" name="senha" autocomplete="current-password" placeholder="••••••••" required />
        </label>
        <button type="submit" class="btn btn--primary btn--block">Entrar</button>
        <p class="auth__msg" id="login-msg" role="status" hidden></p>
      </form>
      <p class="auth__alt">Ainda não é assinante? <a href="index.html#jogos">Ver jogos e planos</a></p>
    </div>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/games.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
