<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Área do assinante | Veneno Pokemon</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#020604" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <header class="nav">
    <div class="container nav__inner">
      <a href="index.html" class="brand" aria-label="Veneno Pokemon, início">
        <img src="assets/logo.svg" alt="" width="36" height="36" />
        <span>veneno<strong>_pokemon</strong></span>
      </a>
      <a href="index.html" class="btn btn--ghost btn--sm">← Voltar ao site</a>
    </div>
  </header>

  <main class="auth">
    <div class="hero__glow" aria-hidden="true"></div>
    <div class="auth__card">
      <p class="auth__prompt">&gt; acesso restrito_</p>
      <h1 class="glitch" data-text="Área do assinante">Área do assinante</h1>
      <p>Entre para baixar o Veneno, ver sua chave de ativação e gerenciar sua assinatura.</p>
      <form id="login-form" novalidate>
        <label class="field">
          <span>E-mail</span>
          <input type="email" name="email" autocomplete="email" placeholder="voce@email.com" required />
        </label>
        <label class="field">
          <span>Senha</span>
          <input type="password" name="senha" autocomplete="current-password" placeholder="••••••••" required />
        </label>
        <button type="submit" class="btn btn--primary btn--block">&gt; autenticar</button>
        <p class="auth__msg" id="login-msg" role="status" hidden></p>
      </form>
      <p class="auth__alt">Ainda não é assinante? <a href="index.html#planos">Ver planos</a></p>
    </div>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
