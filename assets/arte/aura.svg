<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9cc4ff"/><stop offset="1" stop-color="#3f7fe4"/></linearGradient>
    <linearGradient id="b" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f97f0"/><stop offset="1" stop-color="#1c3f8a"/></linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b5fc0"/><stop offset="1" stop-color="#0e214f"/></linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e6f3ff"/><stop offset=".5" stop-color="#6fb2ff" stop-opacity=".7"/><stop offset="1" stop-color="#3f7fe4" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="300" cy="320" r="270" fill="url(#orb)" opacity=".55"/>
  <!-- cabeça de lobo low-poly -->
  <g filter="url(#glow)">
    <polygon points="150,90 230,200 170,250" fill="url(#b)"/>
    <polygon points="450,90 370,200 430,250" fill="url(#c)"/>
    <polygon points="170,110 215,190 180,215" fill="#ff8aa0" opacity=".55"/>
    <polygon points="430,110 385,190 420,215" fill="#ff8aa0" opacity=".45"/>
    <polygon points="230,200 300,170 370,200 300,260" fill="url(#a)"/>
    <polygon points="170,250 230,200 300,260 250,340" fill="url(#a)"/>
    <polygon points="430,250 370,200 300,260 350,340" fill="url(#b)"/>
    <polygon points="170,250 250,340 210,400 120,330" fill="url(#b)"/>
    <polygon points="430,250 350,340 390,400 480,330" fill="url(#c)"/>
    <polygon points="250,340 300,260 350,340 300,470" fill="#dbe9ff"/>
    <polygon points="250,340 300,470 230,430 210,400" fill="#b9d3ff"/>
    <polygon points="350,340 300,470 370,430 390,400" fill="#8fb4ee"/>
  </g>
  <polygon points="282,440 318,440 300,470" fill="#0b1630"/>
  <!-- olhos -->
  <polygon points="214,282 270,300 226,312" fill="#ff3b55" filter="url(#glow)"/>
  <polygon points="386,282 330,300 374,312" fill="#ff3b55" filter="url(#glow)"/>
  <!-- marcas -->
  <path d="M300 186 L300 236" stroke="#e6f3ff" stroke-width="6" stroke-linecap="round"/>
  <g fill="#9cc4ff" opacity=".8">
    <circle cx="90" cy="460" r="8"/><circle cx="520" cy="470" r="6"/><circle cx="540" cy="250" r="5"/><circle cx="60" cy="240" r="5"/>
  </g>
</svg>
