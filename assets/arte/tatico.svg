<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="h1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#55606e"/><stop offset="1" stop-color="#1c2129"/></linearGradient>
    <linearGradient id="h2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a424e"/><stop offset="1" stop-color="#12161c"/></linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a1f"/><stop offset="1" stop-color="#ffcf7a"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- ombros -->
  <polygon points="80,560 170,430 300,470 430,430 520,560" fill="url(#h2)"/>
  <polygon points="170,430 300,470 300,560 120,560" fill="#2b323c"/>
  <!-- pescoço -->
  <polygon points="240,400 360,400 340,470 260,470" fill="#161a20"/>
  <!-- capacete -->
  <polygon points="300,60 420,110 470,230 450,330 300,330" fill="url(#h2)"/>
  <polygon points="300,60 180,110 130,230 150,330 300,330" fill="url(#h1)"/>
  <polygon points="300,60 340,120 300,170 260,120" fill="#6b7685" opacity=".6"/>
  <rect x="200" y="140" width="40" height="22" rx="4" fill="#0d1014" transform="rotate(-14 220 151)"/>
  <!-- máscara -->
  <polygon points="150,330 450,330 420,410 300,440 180,410" fill="#20262e"/>
  <g stroke="#0d1014" stroke-width="5"><line x1="250" y1="360" x2="250" y2="420"/><line x1="300" y1="360" x2="300" y2="436"/><line x1="350" y1="360" x2="350" y2="420"/></g>
  <!-- visor -->
  <polygon points="150,240 450,240 440,320 160,320" fill="#0b0d10"/>
  <polygon points="168,252 432,252 424,308 176,308" fill="url(#v)" filter="url(#glow)"/>
  <polygon points="180,258 300,258 280,302 186,302" fill="#fff" opacity=".22"/>
  <!-- patch -->
  <rect x="380" y="470" width="70" height="40" rx="4" fill="#3fa7e4" opacity=".85"/>
  <text x="392" y="498" fill="#06121f" font-family="monospace" font-size="20" font-weight="700">INJ</text>
</svg>
