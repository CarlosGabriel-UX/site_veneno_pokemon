<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0f2a44"/><stop offset="1" stop-color="#06121f"/></radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fa7e4" stop-opacity="0"/><stop offset="1" stop-color="#3fa7e4" stop-opacity=".75"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="300" cy="300" r="250" fill="url(#bg)" stroke="#3fa7e4" stroke-width="8" filter="url(#glow)"/>
  <g fill="none" stroke="#3fa7e4" stroke-width="2" opacity=".5">
    <circle cx="300" cy="300" r="190"/><circle cx="300" cy="300" r="125"/><circle cx="300" cy="300" r="60"/>
    <line x1="50" y1="300" x2="550" y2="300"/><line x1="300" y1="50" x2="300" y2="550"/>
  </g>
  <!-- mapa estilizado -->
  <path d="M170 200 h90 v60 h80 v-80 h70 v150 h-60 v90 h-110 v-60 h-70 z" fill="none" stroke="#7cc6f0" stroke-width="5" opacity=".55"/>
  <path d="M300 300 L540 230 A250 250 0 0 0 470 120 Z" fill="url(#sweep)"/>
  <g filter="url(#glow)">
    <circle cx="430" cy="200" r="11" fill="#ff8a1f"/><circle cx="380" cy="420" r="11" fill="#ff8a1f"/><circle cx="210" cy="160" r="9" fill="#ff8a1f" opacity=".5"/>
    <circle cx="300" cy="300" r="12" fill="#e6f6ff"/>
  </g>
  <text x="246" y="236" fill="#7cc6f0" font-family="monospace" font-size="22" font-weight="700">B</text>
  <text x="410" y="372" fill="#7cc6f0" font-family="monospace" font-size="22" font-weight="700">A</text>
</svg>
